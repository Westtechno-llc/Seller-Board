/* ============ compute: costs, profit & loss, stock planning ============ */
const C = {};

C.CATS = ['sales', 'shipCredits', 'promo', 'refunds', 'reimb', 'referral', 'fba', 'storage', 'inbound', 'otherFees', 'ads', 'tax'];
C.CAT_LABEL = {
  sales: 'Satış',
  shipCredits: 'Kargo ve hediye paketi geliri',
  promo: 'Promosyon indirimleri',
  refunds: 'İadeler',
  reimb: 'Amazon geri ödemeleri',
  referral: 'Komisyon (referral fee)',
  fba: 'FBA gönderim ücreti',
  storage: 'Depolama',
  inbound: 'Amazon\'a gönderim (inbound)',
  otherFees: 'Diğer Amazon ücretleri',
  ads: 'Reklam ve tanıtım',
  tax: 'Vergi (net)',
};

C.defaultSettings = () => ({ tz: 'America/Los_Angeles', leadDays: 21, safetyDays: 14, targetDays: 60, resellPct: 0 });

C.emptyState = () => ({
  settings: C.defaultSettings(), products: {}, lots: [], expenses: [],
  tx: [], orders: [], ads: [], returns: [], inventory: null, traffic: null, imports: [],
});

/* ---------- binary search over rows sorted by date key ---------- */
C.bounds = function (arr, from, to, key) {
  let lo = 0, hi = arr.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (key(arr[m]) < from) lo = m + 1; else hi = m; }
  const a = lo;
  hi = arr.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (key(arr[m]) <= to) lo = m + 1; else hi = m; }
  return [a, lo];
};
C.txDay = (r) => r.t.slice(0, 10);
C.adDay = (r) => r.d;

/* ---------- landed cost ---------- */
C.lotLines = function (lot) {
  const lines = (lot.lines || []).filter((l) => l && (l.qty > 0));
  const totQty = U.sum(lines, (l) => l.qty);
  const totVal = U.sum(lines, (l) => l.qty * (l.price || 0));
  const ship = lot.shipping || 0;
  const byValue = lot.method !== 'unit' && totVal > 0;
  return lines.map((l) => {
    const share = byValue ? (l.qty * (l.price || 0)) / totVal : (totQty ? l.qty / totQty : 0);
    const shipPer = l.qty ? (ship * share) / l.qty : 0;
    return { sku: l.sku, name: l.name, qty: l.qty, price: l.price || 0, shipPer, landed: (l.price || 0) + shipPer };
  });
};
C.lotTotal = (lot) => U.sum(lot.lines || [], (l) => (l.qty || 0) * (l.price || 0)) + (lot.shipping || 0);

/* Index: sku -> { manual:[{from,cost}], lots:[{date,avg,qty}] } */
C.buildCostIndex = function (S) {
  const idx = {};
  const get = (sku) => idx[sku] || (idx[sku] = { manual: [], lots: [] });
  Object.keys(S.products).forEach((sku) => {
    const p = S.products[sku];
    if (p.costs && p.costs.length) {
      get(sku).manual = p.costs.filter((c) => c && c.cost != null && isFinite(c.cost))
        .map((c) => ({ from: c.from || '0000-00-00', cost: c.cost }))
        .sort((a, b) => (a.from < b.from ? -1 : 1));
    }
  });
  const lots = S.lots.slice().sort((a, b) => ((a.date || '') < (b.date || '') ? -1 : 1));
  const run = {};
  lots.forEach((lot) => {
    C.lotLines(lot).forEach((l) => {
      if (!l.sku) return;
      const r = run[l.sku] || (run[l.sku] = { qty: 0, val: 0 });
      r.qty += l.qty; r.val += l.qty * l.landed;
      get(l.sku).lots.push({ date: lot.date || '0000-00-00', avg: r.val / r.qty, qty: r.qty });
    });
  });
  return idx;
};
C.costAt = function (idx, sku, date) {
  const e = idx[sku];
  if (!e) return null;
  const pick = (arr, k, v) => {
    if (!arr.length) return null;
    let cur = arr[0][v];
    for (let i = 0; i < arr.length; i++) { if (arr[i][k] <= date) cur = arr[i][v]; else break; }
    return cur;
  };
  const m = pick(e.manual, 'from', 'cost');
  if (m != null) return m;
  return pick(e.lots, 'date', 'avg');
};
C.costSource = function (idx, sku) {
  const e = idx[sku];
  if (!e) return null;
  if (e.manual.length) return 'manual';
  if (e.lots.length) return 'lots';
  return null;
};
C.purchasedQty = function (S, sku) {
  let q = 0, first = null;
  S.lots.forEach((lot) => (lot.lines || []).forEach((l) => {
    if (l.sku === sku && l.qty > 0) { q += l.qty; if (!first || (lot.date && lot.date < first)) first = lot.date; }
  }));
  return { qty: q, first };
};

/* ---------- classify one payment-report row into P&L parts ---------- */
C.txParts = function (r) {
  const a = r.a || {};
  const type = (r.y || '').toLowerCase().trim();
  const desc = (r.x || '').toLowerCase();
  const tax = (a.pst || 0) + (a.sct || 0) + (a.gwt || 0) + (a.prt || 0) + (a.mwt || 0) + (a.rf || 0) + (a.rft || 0);
  const tot = a.tot || 0;
  const out = [];
  const push = (c, sub, v) => { v = U.round2(v); if (v) out.push({ c, sub, v }); };
  if (type === 'order') {
    const known = tax + (a.ps || 0) + (a.sc || 0) + (a.gw || 0) + (a.pr || 0) + (a.sf || 0) + (a.ff || 0) + (a.otf || 0) + (a.ot || 0);
    push('sales', 'Ürün satışı', a.ps || 0);
    push('shipCredits', 'Kargo geliri', a.sc || 0);
    push('shipCredits', 'Hediye paketi geliri', a.gw || 0);
    push('promo', 'Promosyon indirimi', a.pr || 0);
    push('referral', 'Komisyon (referral fee)', a.sf || 0);
    push('fba', 'FBA gönderim ücreti', a.ff || 0);
    push('otherFees', 'Diğer işlem ücretleri', (a.otf || 0) + (a.ot || 0) + (tot - known));
    push('tax', 'Vergi (net)', tax);
    return out;
  }
  if (type === 'refund') {
    const prod = (a.ps || 0) + (a.sc || 0) + (a.gw || 0) + (a.pr || 0);
    push('refunds', 'İade edilen satış tutarı', prod);
    push('refunds', 'İadede geri alınan ve kesilen ücretler', tot - tax - prod);
    push('tax', 'Vergi (net)', tax);
    return out;
  }
  if (type === 'transfer' || type === 'debt') { push('transfer', r.y, tot); return out; }
  push('tax', 'Vergi (net)', tax);
  const amt = tot - tax;
  const both = type + ' ' + desc;
  if (/retrocharge/.test(type)) { push('tax', 'Vergi düzeltmesi', amt); return out; }
  if (/chargeback|guarantee|claim/.test(type)) { push('refunds', 'A-to-z / chargeback', amt); return out; }
  if (/liquidation/.test(type)) { push('reimb', 'Tasfiye geliri (liquidation)', amt); return out; }
  if (type === 'adjustment' || /reimburs|safe-t/.test(both)) {
    let sub = 'Diğer düzeltme';
    if (/customer return/.test(desc)) sub = 'Geri ödeme: müşteri iadesi';
    else if (/lost/.test(desc)) sub = 'Geri ödeme: kayıp ürün';
    else if (/damaged/.test(desc)) sub = 'Geri ödeme: hasarlı ürün';
    else if (/reimburs/.test(desc)) sub = 'Geri ödeme: diğer';
    else if (/safe-t/.test(both)) sub = 'SAFE-T geri ödemesi';
    push('reimb', sub, amt); return out;
  }
  if (/advertis/.test(both)) { push('ads', 'Reklam (Amazon Ads faturası)', amt); return out; }
  if (/coupon|vine|lightning|deal/.test(both)) { push('ads', 'Kupon / Deal / Vine ücreti', amt); return out; }
  if (/storage|aged inventory|long-term|long term/.test(both)) {
    push('storage', /aged|long/.test(both) ? 'Uzun süreli depolama ek ücreti' : 'Aylık depolama ücreti', amt); return out;
  }
  if (/inbound|placement|transportation/.test(both)) {
    push('inbound', /placement/.test(both) ? 'Inbound placement ücreti' : 'Inbound nakliye ücreti', amt); return out;
  }
  if (/subscription/.test(both)) { push('otherFees', 'Aylık abonelik', amt); return out; }
  if (/removal|disposal/.test(both)) { push('otherFees', 'Kaldırma / imha ücreti', amt); return out; }
  if (/customer return fee|returns? processing/.test(both)) { push('otherFees', 'İade işlem ücreti', amt); return out; }
  if (type === 'shipping services') { push('otherFees', 'Kargo etiketi', amt); return out; }
  push('otherFees', (r.x || r.y || 'Diğer').slice(0, 60), amt);
  return out;
};

C.blankAgg = function () {
  const cats = {}, detail = {};
  C.CATS.forEach((c) => { cats[c] = 0; detail[c] = {}; });
  return {
    cats, detail, transfer: 0, units: 0, orders: 0, refundUnits: 0,
    cogs: 0, cogsCredit: 0, missingUnits: 0, missingSkus: {},
    expenses: 0, expenseDetail: {}, adSales: 0, adClicks: 0, adImpr: 0, adOrders: 0, adSpendReport: 0,
    bySku: {}, rows: 0,
  };
};
C.blankSku = function (sku) {
  const cats = {};
  C.CATS.forEach((c) => { cats[c] = 0; });
  return { sku, cats, units: 0, orders: 0, refundUnits: 0, cogs: 0, cogsCredit: 0, missingUnits: 0, adSales: 0, adClicks: 0, adImpr: 0 };
};

/* Occurrence dates of an expense inside [from, to]. */
C.expenseDates = function (e, from, to) {
  if (!U.isYmd(e.date)) return [];
  if (e.repeat !== 'monthly') return e.date >= from && e.date <= to ? [e.date] : [];
  const out = [];
  const stop = e.end && U.isYmd(e.end) && e.end < to ? e.end : to;
  for (let k = 0; k < 600; k++) {
    const d = U.addMonths(e.date, k);
    if (d > stop) break;
    if (d >= from) out.push(d);
  }
  return out;
};

/* The main aggregation: everything between two dates (inclusive). */
C.aggregate = function (S, from, to, opts) {
  opts = opts || {};
  const res = C.blankAgg();
  const idx = S._cost || (S._cost = C.buildCostIndex(S));
  const cov = S._adsCov;
  const resell = U.clamp((S.settings.resellPct || 0) / 100, 0, 1);
  const sku = (s) => res.bySku[s] || (res.bySku[s] = C.blankSku(s));
  const orderIds = {}, skuOrders = {};
  const b = C.bounds(S.tx, from, to, C.txDay);
  for (let i = b[0]; i < b[1]; i++) {
    const r = S.tx[i];
    const d = r.t.slice(0, 10);
    const type = (r.y || '').toLowerCase().trim();
    const parts = C.txParts(r);
    res.rows++;
    for (let k = 0; k < parts.length; k++) {
      const p = parts[k];
      if (p.c === 'transfer') { res.transfer += p.v; continue; }
      if (p.c === 'ads' && cov && d >= cov.from && d <= cov.to && /Amazon Ads/.test(p.sub)) continue;
      res.cats[p.c] += p.v;
      if (!opts.light) res.detail[p.c][p.sub] = (res.detail[p.c][p.sub] || 0) + p.v;
      if (r.s) sku(r.s).cats[p.c] += p.v;
    }
    if (type === 'order' && r.s) {
      const q = r.q || 0;
      const sk = sku(r.s);
      res.units += q; sk.units += q;
      if (r.o) {
        if (!orderIds[r.o]) { orderIds[r.o] = 1; res.orders++; }
        const key = r.s + '|' + r.o;
        if (!skuOrders[key]) { skuOrders[key] = 1; sk.orders++; }
      }
      const cost = C.costAt(idx, r.s, d);
      if (cost == null) { res.missingUnits += q; sk.missingUnits += q; if (q) res.missingSkus[r.s] = 1; }
      else { res.cogs += q * cost; sk.cogs += q * cost; }
    } else if (type === 'refund' && r.s) {
      const q = r.q || 0;
      const sk = sku(r.s);
      res.refundUnits += q; sk.refundUnits += q;
      if (resell > 0) {
        const cost = C.costAt(idx, r.s, d);
        if (cost != null) { res.cogsCredit += q * cost * resell; sk.cogsCredit += q * cost * resell; }
      }
    }
  }
  if (S.ads.length) {
    const ab = C.bounds(S.ads, from, to, C.adDay);
    for (let i = ab[0]; i < ab[1]; i++) {
      const r = S.ads[i];
      res.cats.ads -= r.sp; res.adSpendReport += r.sp;
      if (!opts.light) res.detail.ads['Sponsored Products (reklam raporu)'] = (res.detail.ads['Sponsored Products (reklam raporu)'] || 0) - r.sp;
      res.adSales += r.sa; res.adClicks += r.cl; res.adImpr += r.im; res.adOrders += r.or;
      if (r.s) { const sk = sku(r.s); sk.cats.ads -= r.sp; sk.adSales += r.sa; sk.adClicks += r.cl; sk.adImpr += r.im; }
    }
  }
  for (let i = 0; i < S.expenses.length; i++) {
    const e = S.expenses[i];
    const n = C.expenseDates(e, from, to).length;
    if (!n) continue;
    const v = (e.amount || 0) * n;
    res.expenses += v;
    if (!opts.light) res.expenseDetail[e.name || 'Gider'] = (res.expenseDetail[e.name || 'Gider'] || 0) + v;
  }
  C.finish(res);
  return res;
};

C.finish = function (res) {
  let amazonNet = 0;
  C.CATS.forEach((c) => { res.cats[c] = U.round2(res.cats[c]); amazonNet += res.cats[c]; });
  res.amazonNet = U.round2(amazonNet);
  res.cogsNet = res.cogs - res.cogsCredit;
  res.net = U.round2(res.amazonNet - res.cogsNet - res.expenses);
  res.sales = res.cats.sales;
  res.margin = res.sales > 0 ? res.net / res.sales : null;
  res.roi = res.cogsNet > 0 ? res.net / res.cogsNet : null;
  res.refundRate = res.units > 0 ? res.refundUnits / res.units : null;
  res.amazonFees = res.cats.referral + res.cats.fba + res.cats.storage + res.cats.inbound + res.cats.otherFees;
  let allocNet = 0;
  Object.keys(res.bySku).forEach((s) => {
    const k = res.bySku[s];
    let n = 0;
    C.CATS.forEach((c) => { n += k.cats[c]; });
    k.amazonNet = n;
    k.cogsNet = k.cogs - k.cogsCredit;
    k.net = n - k.cogsNet;
    k.sales = k.cats.sales;
    k.fees = k.cats.referral + k.cats.fba + k.cats.storage + k.cats.inbound + k.cats.otherFees;
    k.margin = k.sales > 0 ? k.net / k.sales : null;
    k.roi = k.cogsNet > 0 ? k.net / k.cogsNet : null;
    k.avgPrice = k.units > 0 ? k.sales / k.units : null;
    k.refundRate = k.units > 0 ? k.refundUnits / k.units : null;
    k.acos = k.adSales > 0 ? -k.cats.ads / k.adSales : null;
    allocNet += k.net;
  });
  res.unallocated = U.round2(res.net - allocNet); // account-level items: storage, subscription, unassigned ads, expenses
  res.acos = res.adSales > 0 ? res.adSpendReport / res.adSales : null;
  res.tacos = res.sales > 0 ? -res.cats.ads / res.sales : null;
  return res;
};

/* ---------- time buckets for the chart ---------- */
C.granularity = function (from, to) {
  const n = U.diffDays(from, to) + 1;
  if (n <= 45) return 'day';
  if (n <= 182) return 'week';
  return 'month';
};
C.buckets = function (from, to, gran) {
  const out = [];
  let cur = from;
  let guard = 0;
  while (cur <= to && guard++ < 800) {
    let end;
    if (gran === 'day') end = cur;
    else if (gran === 'week') end = U.addDays(U.weekStart(cur), 6);
    else end = U.monthEnd(cur);
    if (end > to) end = to;
    out.push({ from: cur, to: end });
    cur = U.addDays(end, 1);
  }
  return out;
};
C.bucketLabel = function (b, gran) {
  if (gran === 'day') return U.fmtDate(b.from, { noYear: true });
  if (gran === 'week') return U.fmtDate(b.from, { noYear: true });
  return U.TR_MON[+b.from.slice(5, 7) - 1] + ' ' + b.from.slice(2, 4);
};
C.series = function (S, from, to) {
  const gran = C.granularity(from, to);
  return {
    gran,
    points: C.buckets(from, to, gran).map((b) => {
      const a = C.aggregate(S, b.from, b.to, { light: true });
      return { from: b.from, to: b.to, label: C.bucketLabel(b, gran), sales: a.sales, net: a.net, units: a.units, orders: a.orders, ads: -a.cats.ads, refunds: a.cats.refunds, adSales: a.adSales, adSpend: a.adSpendReport };
    }),
  };
};

/* ---------- data extent & periods ---------- */
C.extent = function (S) {
  let from = null, to = null;
  const see = (a, b) => { if (a && (!from || a < from)) from = a; if (b && (!to || b > to)) to = b; };
  if (S.tx.length) see(S.tx[0].t.slice(0, 10), S.tx[S.tx.length - 1].t.slice(0, 10));
  if (S.ads.length) see(S.ads[0].d, S.ads[S.ads.length - 1].d);
  return { from, to };
};
C.refresh = function (S) {
  S._cost = C.buildCostIndex(S);
  S._adsCov = S.ads.length ? { from: S.ads[0].d, to: S.ads[S.ads.length - 1].d } : null;
  S._extent = C.extent(S);
  S._txTo = S.tx.length ? S.tx[S.tx.length - 1].t.slice(0, 10) : null;
  return S;
};
C.periods = function (S, today) {
  const ext = S._extent || C.extent(S);
  const anchor = ext.to && ext.to <= today ? ext.to : today;
  const ms = U.monthStart(today);
  const lmEnd = U.addDays(ms, -1);
  return {
    last7: { key: 'last7', label: 'Son 7 gün', from: U.addDays(anchor, -6), to: anchor },
    last30: { key: 'last30', label: 'Son 30 gün', from: U.addDays(anchor, -29), to: anchor },
    mtd: { key: 'mtd', label: 'Bu ay', from: ms, to: today },
    lastMonth: { key: 'lastMonth', label: 'Geçen ay', from: U.monthStart(lmEnd), to: lmEnd },
    last90: { key: 'last90', label: 'Son 90 gün', from: U.addDays(anchor, -89), to: anchor },
    ytd: { key: 'ytd', label: 'Bu yıl', from: today.slice(0, 4) + '-01-01', to: today },
    all: { key: 'all', label: 'Tüm veri', from: ext.from || today, to: ext.to && ext.to > today ? ext.to : (ext.to || today) },
  };
};
C.previousRange = function (p) {
  if (p.key === 'mtd') {
    const pf = U.addMonths(p.from, -1);
    return { from: pf, to: U.addMonths(p.to, -1) };
  }
  if (p.key === 'lastMonth') { const e = U.addDays(p.from, -1); return { from: U.monthStart(e), to: e }; }
  if (p.key === 'ytd') { return { from: U.addMonths(p.from, -12), to: U.addMonths(p.to, -12) }; }
  if (p.key === 'all') return null;
  const n = U.diffDays(p.from, p.to) + 1;
  return { from: U.addDays(p.from, -n), to: U.addDays(p.from, -1) };
};

/* ---------- monthly P&L ---------- */
C.monthly = function (S, today, maxMonths) {
  const ext = S._extent || C.extent(S);
  let first = ext.from;
  S.expenses.forEach((e) => { if (U.isYmd(e.date) && (!first || e.date < first)) first = e.date; });
  if (!first) return [];
  let last = ext.to && ext.to > today ? ext.to : today;
  const months = [];
  let cur = U.monthStart(first);
  let guard = 0;
  while (cur <= last && guard++ < 240) { months.push(cur); cur = U.addMonths(cur, 1); }
  const use = maxMonths ? months.slice(-maxMonths) : months;
  return use.map((m) => { const e = U.monthEnd(m); return { month: m, agg: C.aggregate(S, m, e > last ? last : e) }; });
};

/* ---------- B2B share and pending orders (from the All Orders report) ---------- */
C.orderDay = (r) => r.t.slice(0, 10);
C.b2b = function (S, from, to) {
  const res = { total: 0, b2b: 0, units: 0, unitsB2B: 0, bySku: {}, rows: 0 };
  if (!S.orders.length) return res;
  const b = C.bounds(S.orders, from, to, C.orderDay);
  for (let i = b[0]; i < b[1]; i++) {
    const r = S.orders[i];
    if (/cancel/i.test(r.st || '')) continue;
    res.rows++;
    res.total += r.p || 0; res.units += r.q || 0;
    const k = res.bySku[r.s] || (res.bySku[r.s] = { total: 0, b2b: 0, units: 0, unitsB2B: 0 });
    k.total += r.p || 0; k.units += r.q || 0;
    if (r.b) { res.b2b += r.p || 0; res.unitsB2B += r.q || 0; k.b2b += r.p || 0; k.unitsB2B += r.q || 0; }
  }
  res.share = res.total > 0 ? res.b2b / res.total : (res.units > 0 ? res.unitsB2B / res.units : null);
  return res;
};
C.pendingOrders = function (S) {
  const res = { count: 0, units: 0, sales: 0 };
  if (!S.orders.length) return res;
  const since = S._txTo ? U.addDays(S._txTo, -10) : S.orders[0].t.slice(0, 10);
  const ids = {};
  const b = C.bounds(S.tx, since, '9999-12-31', C.txDay);
  for (let i = b[0]; i < b[1]; i++) if (S.tx[i].o) ids[S.tx[i].o] = 1;
  const seen = {};
  const ob = C.bounds(S.orders, since, '9999-12-31', C.orderDay);
  for (let i = ob[0]; i < ob[1]; i++) {
    const r = S.orders[i];
    if (/cancel/i.test(r.st || '') || ids[r.o]) continue;
    if (!seen[r.o]) { seen[r.o] = 1; res.count++; }
    res.units += r.q || 0; res.sales += r.p || 0;
  }
  return res;
};

/* ---------- traffic snapshot keyed by SKU ---------- */
C.trafficBySku = function (S) {
  const out = {};
  if (!S.traffic || !S.traffic.rows) return out;
  const asinToSku = {};
  Object.keys(S.products).forEach((sku) => { const a = S.products[sku].asin; if (a && !asinToSku[a]) asinToSku[a] = sku; });
  S.traffic.rows.forEach((r) => {
    const sku = r.s || asinToSku[r.a];
    if (!sku) return;
    const o = out[sku] || (out[sku] = { se: 0, pv: 0, u: 0, ub: 0, sa: 0, sb: 0, bbw: 0 });
    o.se += r.se; o.pv += r.pv; o.u += r.u; o.ub += r.ub; o.sa += r.sa; o.sb += r.sb; o.bbw += r.bb * (r.pv || 1);
    o.bb = o.bbw / (o.pv || 1);
    o.conv = o.se > 0 ? o.u / o.se : null;
  });
  return out;
};

/* ---------- stock planning ---------- */
C.STOCK_STATUS = {
  out: { label: 'Stok bitti', level: 'crit', rank: 0 },
  order: { label: 'Şimdi sipariş ver', level: 'serious', rank: 1 },
  soon: { label: 'Yakında sipariş ver', level: 'warn', rank: 2 },
  ok: { label: 'Yeterli', level: 'good', rank: 3 },
  over: { label: 'Fazla stok', level: 'info', rank: 4 },
  idle: { label: 'Satış yok', level: 'info', rank: 5 },
  none: { label: 'Stok bilgisi yok', level: 'info', rank: 6 },
};
C.stockPlan = function (S, today) {
  const st = S.settings;
  const idx = S._cost || (S._cost = C.buildCostIndex(S));
  const anchor = S._txTo || today;
  const winFrom = U.addDays(anchor, -29);
  const a30 = C.aggregate(S, winFrom, anchor, { light: true });
  const a7 = C.aggregate(S, U.addDays(anchor, -6), anchor, { light: true });
  const firstTx = S.tx.length ? S.tx[0].t.slice(0, 10) : null;
  const span30 = firstTx ? U.clamp(U.diffDays(firstTx > winFrom ? firstTx : winFrom, anchor) + 1, 1, 30) : 30;
  const inv = {};
  if (S.inventory && S.inventory.rows) S.inventory.rows.forEach((r) => { inv[r.s] = r; });
  const invDate = S.inventory ? S.inventory.date : null;
  const agSince = invDate && S._txTo && S._txTo > invDate ? C.aggregate(S, U.addDays(invDate, 1), S._txTo, { light: true }) : null;
  let agAll = null;
  const skus = {};
  Object.keys(inv).forEach((s) => { skus[s] = 1; });
  Object.keys(a30.bySku).forEach((s) => { if (a30.bySku[s].units > 0) skus[s] = 1; });
  const lotName = {};
  S.lots.forEach((l) => (l.lines || []).forEach((x) => { if (x.sku) { skus[x.sku] = 1; if (x.name && !lotName[x.sku]) lotName[x.sku] = x.name; } }));
  const rows = [];
  Object.keys(skus).forEach((sku) => {
    const p = S.products[sku] || {};
    const u30 = a30.bySku[sku] ? a30.bySku[sku].units : 0;
    const u7 = a7.bySku[sku] ? a7.bySku[sku].units : 0;
    const v = u30 / span30;
    let avail = null, inbound = 0, reserved = 0, unsellable = 0, source = 'none', asOf = null;
    if (inv[sku]) {
      source = 'report'; asOf = invDate;
      const soldSince = agSince && agSince.bySku[sku] ? agSince.bySku[sku].units : 0;
      avail = Math.max(0, inv[sku].av + inv[sku].res - soldSince);
      inbound = inv[sku].inb; reserved = inv[sku].res; unsellable = inv[sku].uns;
    } else {
      const pq = C.purchasedQty(S, sku);
      if (pq.qty > 0) {
        source = 'estimate'; asOf = anchor;
        if (!agAll) agAll = C.aggregate(S, '0000-01-01', '9999-12-31', { light: true });
        const sold = agAll.bySku[sku] ? agAll.bySku[sku].units : 0;
        avail = Math.max(0, pq.qty - sold);
      }
    }
    const lead = p.lead != null && isFinite(p.lead) ? p.lead : st.leadDays;
    const days = avail == null ? null : (v > 0 ? avail / v : Infinity);
    const daysWithInbound = avail == null ? null : (v > 0 ? (avail + inbound) / v : Infinity);
    const stockout = days != null && isFinite(days) ? U.addDays(anchor, Math.floor(days)) : null;
    const reorderBy = daysWithInbound != null && isFinite(daysWithInbound) ? U.addDays(anchor, Math.floor(daysWithInbound - lead - st.safetyDays)) : null;
    const qty = avail == null ? null : Math.max(0, Math.ceil(v * (lead + st.targetDays) - (avail + inbound)));
    let status = 'none';
    if (avail != null) {
      if (v <= 0) status = avail + inbound > 0 ? 'idle' : 'none';
      else if (avail <= 0 && inbound <= 0) status = 'out';
      else if (daysWithInbound < lead + st.safetyDays) status = 'order';
      else if (daysWithInbound < lead + st.safetyDays + 14) status = 'soon';
      else if (daysWithInbound > 180) status = 'over';
      else status = 'ok';
    }
    const cost = C.costAt(idx, sku, anchor);
    rows.push({
      sku, name: p.name || lotName[sku] || '', avail, inbound, reserved, unsellable, source, asOf,
      u7, u30, velocity: v, days, daysWithInbound, stockout, reorderBy, qty, lead, status,
      value: avail != null && cost != null ? (avail + inbound) * cost : null, cost,
    });
  });
  rows.sort((a, b) => (C.STOCK_STATUS[a.status].rank - C.STOCK_STATUS[b.status].rank) || ((a.daysWithInbound == null ? 1e9 : a.daysWithInbound) - (b.daysWithInbound == null ? 1e9 : b.daysWithInbound)));
  return { rows, anchor, invDate, span30 };
};

/* ---------- unit economics / price calculator ---------- */
C.unitEconomics = function (i) {
  const price = i.price || 0, cost = i.cost || 0, ref = (i.refPct || 0) / 100, fba = i.fbaFee || 0, ad = i.adPerUnit || 0, other = i.otherPerUnit || 0;
  const referral = price * ref;
  const fees = referral + fba;
  const profit = price - fees - cost - ad - other;
  const fixed = cost + fba + ad + other;
  const priceFor = (m) => (1 - ref - m > 0.0001 ? fixed / (1 - ref - m) : null);
  return {
    referral, fees, profit, margin: price > 0 ? profit / price : null, roi: cost > 0 ? profit / cost : null,
    breakEven: priceFor(0), priceFor,
  };
};
/* Historic per-unit fee profile of a SKU, used to prefill the calculator. */
C.feeProfile = function (S, sku) {
  const a = C.aggregate(S, '0000-01-01', '9999-12-31', { light: true });
  const k = a.bySku[sku];
  if (!k || !k.units) return null;
  return {
    price: k.sales / k.units,
    refPct: k.sales > 0 ? (-k.cats.referral / k.sales) * 100 : null,
    fbaFee: -k.cats.fba / k.units,
    adPerUnit: -k.cats.ads / k.units,
    units: k.units,
  };
};

/* ---------- merge imported rows: a file replaces what was stored for its own date range ---------- */
C.mergeByRange = function (existing, incoming, from, to, key) {
  if (!incoming.length) return existing;
  const keep = existing.filter((r) => { const d = key(r); return d < from || d > to; });
  const all = keep.concat(incoming);
  all.sort((x, y) => { const a = x.t || x.d, b = y.t || y.d; return a < b ? -1 : a > b ? 1 : 0; });
  return all;
};

/* ============ store: where the data lives ============
   Preferred: the page's own document store (kept with the artifact, same on every device).
   Fallback: IndexedDB in this browser. Last resort: memory only.
   Both backends hold the same small documents, so one code path serves both. */
const Store = {
  mode: 'memory', db: null, idb: null, frozen: false, readOnly: false,
  known: {},          // collection -> { group -> chunkCount }
  queue: new Map(),   // path -> { op, data }
  busy: false, status: 'idle', lastError: null, onStatus: null,
  COLLS: ['app', 'prod', 'tx', 'ord', 'ads', 'ret', 'inv', 'trf'],
  CHUNK_BYTES: 150000,
};

Store.setStatus = function (s, err) {
  Store.status = s; Store.lastError = err || null;
  if (Store.onStatus) Store.onStatus(s, err);
};

Store.openIdb = function () {
  return new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open('westtechno-kar-paneli', 1); } catch (e) { reject(e); return; }
    req.onupgradeneeded = () => { req.result.createObjectStore('docs', { keyPath: 'path' }); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('blocked'));
  });
};
Store.idbAll = function () {
  return new Promise((resolve, reject) => {
    const tx = Store.idb.transaction('docs', 'readonly');
    const rq = tx.objectStore('docs').getAll();
    rq.onsuccess = () => resolve(rq.result || []);
    rq.onerror = () => reject(rq.error);
  });
};
Store.idbWrite = function (path, data) {
  return new Promise((resolve, reject) => {
    const tx = Store.idb.transaction('docs', 'readwrite');
    if (data === null) tx.objectStore('docs').delete(path); else tx.objectStore('docs').put({ path, data });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
};

/* Resolve the backend. Never throws. */
Store.init = async function () {
  let db = null;
  try {
    if (typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function') {
      db = await window.claude.use('db');
    }
  } catch (e) { db = null; }
  if (db) { Store.db = db; Store.mode = 'cloud'; return Store.mode; }
  return Store.initLocal();
};
Store.initLocal = async function () {
  Store.db = null;
  try { Store.idb = await Store.openIdb(); Store.mode = 'local'; }
  catch (e) { Store.idb = null; Store.mode = 'memory'; }
  return Store.mode;
};

Store.splitPath = function (path) {
  const i = path.indexOf('/');
  return [path.slice(0, i), path.slice(i + 1)];
};
Store.noteKnown = function (coll, id) {
  const dot = id.lastIndexOf('.');
  if (dot === -1) return;
  const group = id.slice(0, dot), n = parseInt(id.slice(dot + 1), 10);
  if (!isFinite(n)) return;
  const k = Store.known[coll] || (Store.known[coll] = {});
  k[group] = Math.max(k[group] || 0, n + 1);
};

/* Read every document: { 'coll/id': data }. Falls back to the local backend if the cloud one refuses. */
Store.readAll = async function () {
  Store.known = {};
  const out = {};
  if (Store.mode === 'cloud') {
    try {
      for (let c = 0; c < Store.COLLS.length; c++) {
        const coll = Store.COLLS[c];
        const snap = await Store.db.collection(coll).limit(1000).get();
        snap.docs.forEach((d) => {
          const data = d.data();
          if (data) { out[coll + '/' + d.id] = JSON.parse(JSON.stringify(data)); Store.noteKnown(coll, d.id); }
        });
      }
      return out;
    } catch (e) {
      await Store.initLocal();
    }
  }
  if (Store.mode === 'local') {
    try {
      const all = await Store.idbAll();
      all.forEach((r) => { out[r.path] = r.data; const sp = Store.splitPath(r.path); Store.noteKnown(sp[0], sp[1]); });
    } catch (e) { Store.mode = 'memory'; }
  }
  return out;
};

Store.put = function (path, data) { if (Store.frozen) return; Store.queue.set(path, { op: 'set', data }); Store.pump(); };
Store.del = function (path) { if (Store.frozen) return; Store.queue.set(path, { op: 'del' }); Store.pump(); };

Store.sleep = (ms) => new Promise((r) => setTimeout(r, ms));

Store.writeOne = async function (path, job) {
  if (Store.mode === 'cloud') {
    const sp = Store.splitPath(path);
    const ref = Store.db.collection(sp[0]).doc(sp[1]);
    if (job.op === 'del') await ref.delete(); else await ref.set(job.data);
  } else if (Store.mode === 'local') {
    await Store.idbWrite(path, job.op === 'del' ? null : job.data);
  }
};

Store.pump = async function () {
  if (Store.busy) return;
  Store.busy = true;
  Store.setStatus('saving');
  let failed = null;
  while (Store.queue.size) {
    const entry = Store.queue.entries().next().value;
    const path = entry[0], job = entry[1];
    Store.queue.delete(path);
    let tries = 0, done = false;
    while (!done) {
      try { await Store.writeOne(path, job); done = true; }
      catch (e) {
        const code = e && e.code;
        tries++;
        if ((code === 'unavailable' || code === 'resource_exhausted' || code == null) && tries < 4) { await Store.sleep(600 * tries + Math.random() * 400); continue; }
        failed = e || { message: 'Kaydedilemedi' };
        if (code === 'invalid_argument' && job.op === 'set' && Store.mode === 'cloud') Store.readOnly = true;
        done = true;
      }
    }
    if (failed && (failed.code === 'quota_exceeded' || Store.readOnly || failed.code === 'revoked' || failed.code === 'not_granted')) { Store.queue.clear(); break; }
  }
  Store.busy = false;
  Store.setStatus(failed ? 'error' : 'saved', failed);
  if (Store.queue.size) Store.pump();
};
Store.idle = async function () { while (Store.busy || Store.queue.size) await Store.sleep(40); };

Store.byteLen = function (str) {
  let n = str.length;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); if (c > 0x7f) n += c > 0x7ff ? 2 : 1; }
  return n;
};
/* Split items into chunks whose JSON stays under the per-document size limit. */
Store.chunk = function (items) {
  const chunks = [];
  let cur = [], size = 0;
  for (let i = 0; i < items.length; i++) {
    const len = Store.byteLen(JSON.stringify(items[i])) + 1;
    if (cur.length && size + len > Store.CHUNK_BYTES) { chunks.push(cur); cur = []; size = 0; }
    cur.push(items[i]); size += len;
  }
  if (cur.length) chunks.push(cur);
  return chunks;
};
/* Write one logical group (e.g. one month of transactions) as numbered chunk documents. */
Store.writeGroup = function (coll, group, items, meta) {
  if (Store.frozen) return;
  const chunks = Store.chunk(items || []);
  const k = Store.known[coll] || (Store.known[coll] = {});
  const before = k[group] || 0;
  for (let i = 0; i < chunks.length; i++) {
    Store.put(coll + '/' + group + '.' + i, Object.assign({ g: group, i, n: chunks.length, items: chunks[i] }, meta || {}));
  }
  for (let i = chunks.length; i < before; i++) Store.del(coll + '/' + group + '.' + i);
  if (chunks.length) k[group] = chunks.length; else delete k[group];
};
Store.wipe = function () {
  Object.keys(Store.known).forEach((coll) => {
    Object.keys(Store.known[coll]).forEach((group) => {
      for (let i = 0; i < Store.known[coll][group]; i++) Store.del(coll + '/' + group + '.' + i);
    });
  });
  Store.known = {};
  ['app/settings', 'app/lots', 'app/expenses', 'app/imports'].forEach((p) => Store.del(p));
};

/* ---------- state <-> documents ---------- */
const Persist = {};
Persist.MONTHLY = { tx: (r) => r.t.slice(0, 7), ord: (r) => r.t.slice(0, 7), ads: (r) => r.d.slice(0, 7), ret: (r) => r.d.slice(0, 7) };
Persist.STATE_KEY = { tx: 'tx', ord: 'orders', ads: 'ads', ret: 'returns' };

Persist.assemble = function (docs) {
  const S = C.emptyState();
  const groups = {};
  Object.keys(docs).forEach((path) => {
    const sp = Store.splitPath(path);
    const coll = sp[0], id = sp[1], d = docs[path];
    if (!d) return;
    if (coll === 'app') {
      if (id === 'settings' && d.settings) S.settings = Object.assign(C.defaultSettings(), d.settings);
      else if (id === 'lots' && Array.isArray(d.items)) S.lots = d.items;
      else if (id === 'expenses' && Array.isArray(d.items)) S.expenses = d.items;
      else if (id === 'imports' && Array.isArray(d.items)) S.imports = d.items;
      return;
    }
    if (!Array.isArray(d.items)) return;
    const g = groups[coll] || (groups[coll] = []);
    g.push(d);
  });
  const cat = (coll) => {
    const arr = (groups[coll] || []).slice().sort((a, b) => (a.g < b.g ? -1 : a.g > b.g ? 1 : (a.i || 0) - (b.i || 0)));
    let out = [];
    arr.forEach((d) => { out = out.concat(d.items); });
    return out;
  };
  cat('prod').forEach((p) => { if (p && p.sku) S.products[p.sku] = p; });
  S.lots.forEach((lot) => (lot.lines || []).forEach((l) => { if (l && l.sku && !S.products[l.sku]) S.products[l.sku] = { sku: l.sku, name: l.name || '', costs: [] }; }));
  S.tx = cat('tx').sort((x, y) => (x.t < y.t ? -1 : x.t > y.t ? 1 : 0));
  S.orders = cat('ord').sort((x, y) => (x.t < y.t ? -1 : x.t > y.t ? 1 : 0));
  S.ads = cat('ads').sort((x, y) => (x.d < y.d ? -1 : x.d > y.d ? 1 : 0));
  S.returns = cat('ret').sort((x, y) => (x.d < y.d ? -1 : x.d > y.d ? 1 : 0));
  const inv = (groups.inv || []).slice().sort((a, b) => (a.i || 0) - (b.i || 0));
  if (inv.length) { let rows = []; inv.forEach((d) => { rows = rows.concat(d.items); }); S.inventory = { date: inv[0].date || null, rows }; }
  const trf = (groups.trf || []).slice().sort((a, b) => (a.i || 0) - (b.i || 0));
  if (trf.length) { let rows = []; trf.forEach((d) => { rows = rows.concat(d.items); }); S.traffic = { from: trf[0].from || null, to: trf[0].to || null, rows }; }
  return S;
};

Persist.settings = (S) => Store.put('app/settings', { settings: S.settings });
Persist.lots = (S) => Store.put('app/lots', { items: S.lots });
Persist.expenses = (S) => Store.put('app/expenses', { items: S.expenses });
Persist.imports = (S) => Store.put('app/imports', { items: S.imports.slice(-80) });
Persist.products = (S) => Store.writeGroup('prod', 'p', Object.keys(S.products).sort().map((k) => S.products[k]));
Persist.inventory = (S) => Store.writeGroup('inv', 's', S.inventory ? S.inventory.rows : [], S.inventory ? { date: S.inventory.date } : null);
Persist.traffic = (S) => Store.writeGroup('trf', 's', S.traffic ? S.traffic.rows : [], S.traffic ? { from: S.traffic.from, to: S.traffic.to } : null);
/* Rewrite the month documents that a date range touches. */
Persist.months = function (S, coll, from, to) {
  const key = Persist.MONTHLY[coll];
  const rows = S[Persist.STATE_KEY[coll]];
  const months = {};
  let cur = U.monthStart(from);
  let guard = 0;
  while (cur <= to && guard++ < 600) { months[cur.slice(0, 7)] = []; cur = U.addMonths(cur, 1); }
  for (let i = 0; i < rows.length; i++) { const m = key(rows[i]); if (months[m]) months[m].push(rows[i]); }
  Object.keys(months).forEach((m) => Store.writeGroup(coll, m, months[m]));
};
Persist.allMonths = function (S, coll) {
  const key = Persist.MONTHLY[coll];
  const rows = S[Persist.STATE_KEY[coll]];
  const months = {};
  Object.keys(Store.known[coll] || {}).forEach((g) => { months[g] = []; });
  for (let i = 0; i < rows.length; i++) { const m = key(rows[i]); (months[m] || (months[m] = [])).push(rows[i]); }
  Object.keys(months).forEach((m) => Store.writeGroup(coll, m, months[m]));
};
Persist.everything = function (S) {
  Persist.settings(S); Persist.lots(S); Persist.expenses(S); Persist.imports(S); Persist.products(S);
  Persist.inventory(S); Persist.traffic(S);
  ['tx', 'ord', 'ads', 'ret'].forEach((c) => Persist.allMonths(S, c));
};
Persist.exportable = function (S) {
  return {
    app: 'westtechno-kar-paneli', version: 1, exportedAt: new Date().toISOString(),
    settings: S.settings, products: S.products, lots: S.lots, expenses: S.expenses,
    tx: S.tx, orders: S.orders, ads: S.ads, returns: S.returns, inventory: S.inventory, traffic: S.traffic, imports: S.imports,
  };
};
Persist.fromExport = function (o) {
  if (!o || o.app !== 'westtechno-kar-paneli') return null;
  const S = C.emptyState();
  S.settings = Object.assign(C.defaultSettings(), o.settings || {});
  S.products = o.products && typeof o.products === 'object' ? o.products : {};
  ['lots', 'expenses', 'tx', 'orders', 'ads', 'returns', 'imports'].forEach((k) => { if (Array.isArray(o[k])) S[k] = o[k]; });
  S.inventory = o.inventory && Array.isArray(o.inventory.rows) ? o.inventory : null;
  S.traffic = o.traffic && Array.isArray(o.traffic.rows) ? o.traffic : null;
  return S;
};

Demo.rng = function (seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

Demo.poisson = function (rnd, mean) {
  const L = Math.exp(-mean);
  let k = 0, p = 1;
  do { k++; p *= rnd(); } while (p > L);
  return k - 1;
};

Demo.build = function (today) {

  let oidN = 1000000;
  const newOid = () => '11' + Math.floor(1 + rnd() * 3) + '-' + (oidN += 1 + Math.floor(rnd() * 9000)) + '-' + (1000000 + Math.floor(rnd() * 8999999));
  let balance = 0;

  });

  for (let i = 0; i < DAYS; i++) {
    const d = U.addDays(start, i);
    const dow = new Date(U.toUTC(d)).getUTCDay();
    const season = 0.75 + 0.5 * (i / DAYS) + (dow === 0 || dow === 6 ? 0.12 : 0);
    Demo.PRODUCTS.forEach((p, pi) => {
      const n = Demo.poisson(rnd, p.mean * season * (pi === 3 && i > 80 ? 0.6 : 1));
      for (let k = 0; k < n; k++) {
        const q = rnd() < 0.08 ? 2 + Math.floor(rnd() * 3) : 1;
        const b2b = rnd() < (q > 1 ? 0.7 : 0.18);

        const ps = U.round2(unit * q);
        const sf = -U.round2(Math.max(0.3, ps * 0.15));
        const ff = -U.round2(p.fba * q);
        const taxAmt = U.round2(ps * 0.07);
        const oid = newOid();

            balance += ra.tot;

      const clicks = Demo.poisson(rnd, p.mean * 2.2 * season);

        adAccrued += sp;

    });
    const dom = +d.slice(8, 10);

const Chart = {};

Chart.niceStep = function (span, target) {
  const raw = span / Math.max(1, target);
  const pow = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const n = raw / pow;
  const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return m * pow;
};
Chart.ticks = function (min, max, target) {
  if (max === min) { max = min + 1; }
  const step = Chart.niceStep(max - min, target || 4);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.abs(v) < step / 1e6 ? 0 : v);
  return { ticks: out, lo, hi };
};
Chart.axisFmt = function (v, money) {
  const a = Math.abs(v);
  let s;
  if (a >= 1e6) s = (a / 1e6).toFixed(a % 1e6 ? 1 : 0) + 'M';
  else if (a >= 1e4) s = (a / 1e3).toFixed(0) + 'K';
  else if (a >= 1e3) s = (a / 1e3).toFixed(a % 1e3 ? 1 : 0) + 'K';
  else s = a % 1 ? a.toFixed(a < 10 ? 2 : 0) : String(a);
  return (v < 0 ? '−' : '') + (money ? U.cur : '') + s;
};

/* cfg: { bars:{key,label}, line:{key,label}|null, money:true, height, tip:(pt)=>[[label,value]], rangeLabel:(pt)=>string } */
Chart.time = function (host, points, cfg) {

    const n = points.length;

    const tk = Chart.ticks(Math.min(0, Math.min.apply(null, vals)), Math.max(0, Math.max.apply(null, vals), 1e-9), 4);
    const plotW = W - padL - padR;

      svg.appendChild(sv('text', { x: padL - 8, y: y(t) + 4, 'text-anchor': 'end', class: 'c-tick', text: Chart.axisFmt(t, cfg.money !== false) }));

    });

      if (e.key === 'ArrowRight') { show(Math.min(n - 1, state.active + 1)); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { show(Math.max(0, state.active < 0 ? n - 1 : state.active - 1)); e.preventDefault(); }
      else if (e.key === 'Escape') hide();
    });
    svg.addEventListener('focus', () => { if (state.active < 0 && n) show(n - 1); });
    svg.addEventListener('blur', hide);
    svg.appendChild(hit);
    host.appendChild(svg);
    host.appendChild(tip);
  };
  draw();
  if (typeof ResizeObserver !== 'undefined') {
    let last = host.clientWidth, timer = null;
    const ro = new ResizeObserver(() => {
      if (!host.isConnected) { ro.disconnect(); return; }
      if (Math.abs(host.clientWidth - last) < 2) return;
      last = host.clientWidth;
      clearTimeout(timer); timer = setTimeout(draw, 60);

  }
};

App.loadXlsx = function () {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => (window.XLSX ? resolve(window.XLSX) : reject(new Error('xlsx')));
    s.onerror = () => reject(new Error('xlsx'));
    document.head.appendChild(s);
  });
};
App.readFile = async function (file) {
  const name = file.name || 'dosya';
  if (/\.(xlsx|xlsm|xls)$/i.test(name)) {
    let X;
    try { X = await App.loadXlsx(); } catch (e) { return { name, error: 'Excel dosyası okunamadı. Raporu CSV olarak indirip tekrar dene.' }; }
    const wb = X.read(await file.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = X.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    return { name, res: P.parseRows(rows, { tz: App.S.settings.tz }) };
  }
  const text = await file.text();
  if (/\.json$/i.test(name) || /^\s*\{/.test(text.slice(0, 50))) {
    let obj = null;
    try { obj = JSON.parse(text); } catch (e) { obj = null; }
    const S = Persist.fromExport(obj);
    return S ? { name, backup: S } : { name, error: 'Bu JSON dosyası bir Kâr Paneli yedeği değil.' };
  }
  return { name, res: P.parseText(text, { tz: App.S.settings.tz }) };
};
App.askPeriod = function (name) {
  return new Promise((resolve) => {
    const per = C.periods(App.S, App.today);
    const f = UI.input({ type: 'date', id: 'trf-from', value: per.last30.from }), t = UI.input({ type: 'date', id: 'trf-to', value: per.last30.to });
    let done = false;

      h('p.muted', { text: name + ' dosyasında tarih bilgisi yok. Raporu indirirken seçtiğin tarih aralığını gir.' }),
      h('div.row', null, UI.field('Başlangıç', f), UI.field('Bitiş', t))),
    (close) => [UI.btn('Bu dosyayı atla', { onclick: () => { done = true; close(); resolve(null); } }),
      UI.btn('Kaydet', { kind: 'primary', onclick: () => { if (!U.isYmd(f.value) || !U.isYmd(t.value) || f.value > t.value) { UI.toast('Geçerli bir tarih aralığı gir.', 'error'); return; } done = true; close(); resolve({ from: f.value, to: t.value }); } })]);
    const obs = new MutationObserver(() => { if (!document.getElementById('trf-from') && !done) { done = true; obs.disconnect(); resolve(null); } });
    obs.observe(document.getElementById('modal-host'), { childList: true });
    void m;
  });
};
App.applyImport = async function (name, res) {
  const S = App.S;
  const entry = { id: U.uid(), kind: res.kind, name, at: new Date().toISOString(), count: res.count, from: res.from, to: res.to };
  (res.products || []).forEach(App.upsertProduct);
  if (res.kind === 'tx') { S.tx = C.mergeByRange(S.tx, res.rows, res.from, res.to, C.txDay); Persist.months(S, 'tx', res.from, res.to); }
  else if (res.kind === 'orders') { S.orders = C.mergeByRange(S.orders, res.rows, res.from, res.to, C.orderDay); Persist.months(S, 'ord', res.from, res.to); }
  else if (res.kind === 'ads') { S.ads = C.mergeByRange(S.ads, res.rows, res.from, res.to, C.adDay); Persist.months(S, 'ads', res.from, res.to); }
  else if (res.kind === 'returns') { S.returns = C.mergeByRange(S.returns, res.rows, res.from, res.to, (r) => r.d); Persist.months(S, 'ret', res.from, res.to); }
  else if (res.kind === 'inventory') {
    const date = res.snapshot || App.today;
    S.inventory = { date, rows: res.rows }; entry.from = entry.to = date; Persist.inventory(S);
  } else if (res.kind === 'traffic') {
    const p = await App.askPeriod(name);
    if (!p) return { name, kind: res.kind, skipped: true };
    S.traffic = { from: p.from, to: p.to, rows: res.rows }; entry.from = p.from; entry.to = p.to; Persist.traffic(S);
  }
  S.imports.push(entry);
  return { name, kind: res.kind, count: res.count, from: entry.from, to: entry.to, warnings: res.warnings || [] };
};
App.importFiles = async function (files) {
  const list = Array.prototype.slice.call(files || []);
  if (!list.length) return;
  if (App.demo) App.setDemo(false);
  const results = [];
  let backup = null;
  for (let i = 0; i < list.length; i++) {
    let r;
    try { r = await App.readFile(list[i]); } catch (e) { r = { name: list[i].name, error: 'Dosya okunamadı.' }; }
    if (r.backup) { backup = r; continue; }
    if (r.error || !r.res) { results.push({ name: r.name, error: r.error || 'Okunamadı.' }); continue; }
    if (r.res.error) { results.push({ name: r.name, error: r.res.error }); continue; }
    if (!r.res.count) { results.push({ name: r.name, error: 'Dosyada okunabilir satır bulunamadı.' }); continue; }
    try { results.push(await App.applyImport(r.name, r.res)); }
    catch (e) { console.error(e); results.push({ name: r.name, error: 'İçe aktarılırken hata oluştu.' }); }
  }
  if (results.some((r) => !r.error && !r.skipped)) {
    Persist.products(App.S); Persist.imports(App.S);
    C.refresh(App.S);
    const ext = App.S._extent;
    if (ext.to) {
      const p = App.getPeriod();
      const a = C.aggregate(App.S, p.from, p.to, { light: true });
      if (!a.rows && !a.adSpendReport) App.period = 'all';
    }
  }
  App.ui.lastImport = results;
  if (backup) { App.confirmRestore(backup); }
  App.rerender();
  const ok = results.filter((r) => !r.error && !r.skipped).length, bad = results.filter((r) => r.error).length;
  if (ok && !bad) UI.toast(ok + ' rapor yüklendi.', 'good');
  else if (ok && bad) UI.toast(ok + ' rapor yüklendi, ' + bad + ' dosya okunamadı. Ayrıntılar Veri sekmesinde.', 'error');
  else if (bad) UI.toast(bad === 1 ? results.find((r) => r.error).error : bad + ' dosya okunamadı. Ayrıntılar Veri sekmesinde.', 'error');
};

/* ============ views: costs (products + purchase invoices), expenses ============ */
App.setCurrentCost = function (sku, v) {
  const p = App.product(sku);
  if (!p.costs) p.costs = [];
  if (v == null) p.costs = [];
  else if (!p.costs.length) p.costs.push({ cost: v });
  else {
    let cur = p.costs[0];
    p.costs.forEach((c) => { if ((c.from || '') <= App.today) cur = c; });
    cur.cost = v;
  }
  App.saveProducts(); App.touch();
};
App.addCostPeriod = function (sku, from, v) {
  const p = App.product(sku);
  if (!p.costs) p.costs = [];
  const key = p.costs.length ? (from || '') : '';
  const ex = p.costs.find((c) => (c.from || '') === key);
  if (ex) ex.cost = v; else p.costs.push(key ? { from: key, cost: v } : { cost: v });
  p.costs.sort((a, b) => ((a.from || '') < (b.from || '') ? -1 : 1));
  App.saveProducts(); App.touch();
};
App.removeCostPeriod = function (sku, from) {
  const p = App.product(sku);
  p.costs = (p.costs || []).filter((c) => (c.from || '') !== (from || ''));
  App.saveProducts(); App.touch();
};
App.saveLots = function () { if (!App.demo) Persist.lots(App.S); App.touch(); };
/* Is this SKU referenced by any report, invoice or manual cost? */
App.skuInUse = function (sku) {
  const S = App.S;
  const p = S.products[sku];
  if (p && p.costs && p.costs.length) return true;
  if (S.lots.some((l) => (l.lines || []).some((x) => x.sku === sku))) return true;
  if (S.tx.some((r) => r.s === sku) || S.orders.some((r) => r.s === sku) || S.ads.some((r) => r.s === sku)) return true;
  if (S.inventory && S.inventory.rows.some((r) => r.s === sku)) return true;
  return false;
};
App.pruneProduct = function (sku) {
  if (!sku || !App.S.products[sku] || App.skuInUse(sku)) return false;
  delete App.S.products[sku];
  return true;
};

    UI.field('Sipariş ve iade raporlarının günü', tzSel, 'Bu raporlar saati UTC olarak verir. Gün hesabı seçtiğin saat dilimine göre yapılır.')));

  const where = Store.mode === 'cloud' ? 'Verilerin bu sayfanın kendi deposunda tutuluyor. Sayfayı hangi cihazdan açarsan aç aynı veriyi görürsün. Sayfayı paylaştığın kişiler de bu rakamları görür.'
    : Store.mode === 'local' ? 'Verilerin yalnızca bu tarayıcıda tutuluyor. Tarayıcı verilerini temizlersen ya da başka cihazdan açarsan görünmez. Düzenli yedek al.'
      : 'Bu görünümde veri saklanamıyor. Sayfayı kapatınca yüklediklerin kaybolur.';
  const backup = Shared.card('Yedek', where, h('div.row', null,
    UI.btn('Yedeği indir', { icon: 'download', onclick: () => App.saveFile('westtechno-kar-paneli-yedek-' + App.today + '.json', JSON.stringify(Persist.exportable(App.S))) }),
    UI.btn('Yedekten geri yükle', { icon: 'upload', onclick: App.pickFiles }),
    App.demo ? UI.btn('Örneği kapat', { icon: 'eye', onclick: () => App.setDemo(false) }) : UI.btn('Örnek veriyle gez', { icon: 'eye', onclick: () => App.setDemo(true) }),
    UI.btn('Tüm veriyi sil', { kind: 'danger', icon: 'trash', onclick: () => UI.confirm('Tüm veriyi sil', 'Yüklediğin raporlar, maliyetler, faturalar ve giderler kalıcı olarak silinecek. Önce yedek indirmeni öneririm.', 'Hepsini sil', App.wipeAll, true) })));

  return h('div.page', null,
    Shared.head('Veri', 'Raporları yükle, yüklü veriyi yönet, yedek al.'),
    drop, resultBox,
    Shared.card('Yüklü veri', null, table),
    h('div.section-bar', null, h('h2.section-title', { text: 'Hangi rapor, nereden indirilir' })),
    guides,
    h('div.grid-2', null, settings, backup));
};

/* ============ boot ============ */
App.boot = function () {
  const nav = document.getElementById('nav');
  App.VIEWS.forEach((v) => {
    nav.appendChild(h('button.nav-btn', { type: 'button', dataset: { view: v.id }, onclick: () => App.go(v.id) }, icon(v.icon, 17), h('span', { text: v.label })));
  });
  const fromHash = () => {
    const hsh = (location.hash || '').replace('#', '');
    const v = App.VIEWS.find((x) => x.hash === hsh);
    if (v && v.id !== App.view) { App.view = v.id; App.rerender(); }
  };
  fromHash();
  window.addEventListener('hashchange', fromHash);

  const fi = document.getElementById('file-input');
  fi.addEventListener('change', () => { App.importFiles(fi.files); });

  const veil = document.getElementById('dropveil');
  let depth = 0;
  const hasFiles = (e) => e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') !== -1;
  window.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); depth++; veil.hidden = false; });
  window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave', (e) => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) veil.hidden = true; });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; veil.hidden = true;
    App.importFiles(e.dataTransfer.files);
  });

  App.renderNow();
  Store.init().then(() => Store.readAll()).then((docs) => {
    App.S = C.refresh(Persist.assemble(docs));
  }).catch((e) => { console.error(e); App.S = C.refresh(C.emptyState()); }).then(() => {
    App.loading = false;
    App.renderNow();
  });
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', App.boot); else App.boot();

})();
</script>

</body></html>
