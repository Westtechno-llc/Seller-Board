<style>
/* Layout: a dark rail of sections and one ledger-like column on a white ground. Period cards with colored header bands sit on top; one period scopes everything below them. */
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f4f6f7; --surface-3: #e9edef;
  --ink: #111c1f; --ink-2: #40525a; --muted: #62737b; --line: #dfe5e8; --line-2: #c4ced3;
  --accent: #0b7f7c; --accent-strong: #086561; --accent-wash: #e0f1f0; --on-accent: #ffffff;
  --rail: #17272c; --rail-ink: #dbe5e7; --rail-muted: #93a7ac; --rail-line: #283d43; --rail-hover: #213439; --rail-on: #0e3f43; --rail-on-ink: #6fe0d8;
  --band-1: #10353f; --band-2: #124652; --band-3: #125965; --band-4: #0f6c73; --band-5: #0b7f7c; --on-band: #ffffff;
  --s1: #11a3a0; --s2: #4a3aa7; --grid: #e8ecee; --axis: #c4ced3; --bar-quiet: #c4ced3;
  --good: #0ca30c; --good-ink: #006300; --good-wash: #e5f4e5;
  --warn: #fab219; --warn-ink: #734d00; --warn-wash: #fff2d2;
  --serious: #ec835a; --serious-ink: #8a3714; --serious-wash: #fdeae2;
  --crit: #d03b3b; --crit-ink: #a52222; --crit-wash: #fbe5e5;
  --info-ink: #40525a; --info-wash: #e9edef;
  --shadow: 0 1px 2px rgba(17, 28, 31, .06), 0 8px 24px rgba(17, 28, 31, .08);
  --card-shadow: 0 1px 2px rgba(17, 28, 31, .05);
  --veil: rgba(10, 20, 23, .5);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 4px; --r-sm: 4px;
}

    --info-ink: #b8c6ca; --info-wash: #1f2d33;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .4);
    --card-shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --veil: rgba(0, 0, 0, .62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1518; --surface: #131d21; --surface-2: #18242a; --surface-3: #1f2d33;
  --ink: #eef3f4; --ink-2: #b8c6ca; --muted: #8fa1a7; --line: #25343a; --line-2: #374a51;
  --accent: #3fc4be; --accent-strong: #6bd8d2; --accent-wash: #12302f; --on-accent: #04201f;
  --rail: #090f11; --rail-ink: #dbe5e7; --rail-muted: #8fa1a7; --rail-line: #1c292e; --rail-hover: #141f23; --rail-on: #0e3336; --rail-on-ink: #6fe0d8;
  --band-1: #153f4a; --band-2: #164f5c; --band-3: #15616d; --band-4: #12727a; --band-5: #0f8582; --on-band: #ffffff;
  --s1: #14a09c; --s2: #8b7fe8; --grid: #1f2c31; --axis: #374a51; --bar-quiet: #3d5158;
  --good: #0ca30c; --good-ink: #6ad86a; --good-wash: #10301a;
  --warn: #fab219; --warn-ink: #fbcb62; --warn-wash: #33290e;
  --serious: #ec835a; --serious-ink: #f4aa8b; --serious-wash: #38211a;
  --crit: #d03b3b; --crit-ink: #f29090; --crit-wash: #3b1919;
  --info-ink: #b8c6ca; --info-wash: #1f2d33;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .4);
  --card-shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --veil: rgba(0, 0, 0, .62);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ol, ul { margin: 0; }
ol, ul { padding: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; }
.muted { color: var(--muted); }
.strong { font-weight: 600; }
.neg { color: var(--crit-ink); }
.mono, .sku { font-family: var(--font-mono); font-size: 12px; }
.sku { color: var(--muted); display: block; }
.nowrap { white-space: nowrap; }
.note { color: var(--muted); font-size: 12.5px; max-width: 78ch; }
.big { font-size: 22px; font-weight: 600; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--rail); color: var(--rail-ink); border-right: 1px solid var(--rail-line); display: flex; flex-direction: column; gap: 18px; padding: 18px 12px 14px; position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.rail-brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; }
.rail-brand img { width: 34px; height: auto; display: block; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; line-height: 1.1; }
.brand-sub { color: var(--rail-muted); font-size: 12px; }
.rail-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-btn { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--rail-ink); font-weight: 500; text-align: left; white-space: nowrap; }
.nav-btn .ic { color: var(--rail-muted); }
.nav-btn:focus-visible, .rail :focus-visible { outline-color: var(--rail-on-ink); }
.nav-btn:hover { background: var(--rail-hover); }
.nav-btn.on { background: var(--rail-on); color: var(--rail-on-ink); }
.nav-btn.on .ic { color: var(--rail-on-ink); }
.rail-foot { margin-top: auto; padding: 0 8px; }
.save { display: flex; gap: 7px; align-items: flex-start; color: var(--rail-muted); font-size: 12px; line-height: 1.35; }
.save.bad { color: #f6a5a5; }
.save .ic { margin-top: 1px; }
.main-col { min-width: 0; }
main { padding-inline: clamp(16px, 3vw, 34px); padding-block: 22px 56px; }
.page { display: flex; flex-direction: column; gap: 18px; max-width: 1280px; margin-inline: auto; min-width: 0; }

@media (max-width: 960px) {
  .app { display: block; }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px 0; border-right: 0; border-bottom: 1px solid var(--rail-line); overflow: visible; }
  .rail-nav { order: 3; flex: 1 0 100%; flex-direction: row; gap: 2px; overflow-x: auto; margin-inline: -16px; padding: 0 16px 8px; scrollbar-width: thin; }
  .rail-foot { margin: 0 0 0 auto; padding: 0; }
  .save { max-width: 190px; }
  .nav-btn { padding: 7px 10px; }
}

/* ---------- page head, sections ---------- */
.page-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; justify-content: space-between; }
.page-title { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; }
.page-sub { color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.head-actions, .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-between { justify-content: space-between; }
.row-end { align-items: flex-end; }
.row-center { justify-content: center; }
.row-right { justify-content: flex-end; flex-wrap: nowrap; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.section-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-top: 6px; }
.section-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.section-title .muted { font-family: var(--font-body); font-size: 13px; font-weight: 400; letter-spacing: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; }
.grid-chart { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .grid-chart { grid-template-columns: minmax(0, 1fr); } }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; box-shadow: var(--card-shadow); }
.card-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-start; justify-content: space-between; padding: 14px 16px 0; }
.card-title { font-size: 15px; font-weight: 600; }
.card-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; max-width: 70ch; }
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-flush { overflow: hidden; }
.loading-card { padding: 20px 16px; }

/* ---------- buttons, inputs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); color: var(--ink); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-3); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); padding: 0 8px; }
.btn-danger { color: var(--crit-ink); border-color: var(--crit); }
.btn-danger:hover { background: var(--crit-wash); }
.btn-sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.input { height: 34px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); color: var(--ink); min-width: 0; max-width: 100%; }
.input::placeholder { color: var(--muted); }
.input.num { text-align: right; font-variant-numeric: tabular-nums; width: 92px; }
select.input { padding-right: 6px; }
.affix { display: inline-flex; align-items: stretch; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); overflow: hidden; vertical-align: middle; }
.affix:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.affix .input { border: 0; border-radius: 0; outline: none; height: 32px; }
.affix-pre, .affix-post { display: flex; align-items: center; padding: 0 8px; color: var(--muted); background: var(--surface-2); font-size: 12.5px; }
.affix-pre { border-right: 1px solid var(--line); }
.affix-post { border-left: 1px solid var(--line); }
.affix-s .input.num { width: 58px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > .affix, .field > .input { align-self: flex-start; }
.field-label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.field-hint { font-size: 12px; color: var(--muted); max-width: 44ch; }
.check { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.search { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); border-radius: var(--r); background-color: var(--surface-2); padding: 0 10px; background: var(--surface); color: var(--muted); min-width: 0; flex: 1 1 220px; max-width: 360px; }
.search:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.search .input { border: 0; outline: none; padding: 0; height: 32px; flex: 1; background: transparent; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.toolbar-form { align-items: flex-end; }
.toolbar-form .note { flex: 1 1 260px; }

/* ---------- chips, alerts, banners ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 1.5; white-space: nowrap; background: var(--info-wash); color: var(--info-ink); }
.chip-good { background: var(--good-wash); color: var(--good-ink); }
.chip-warn { background: var(--warn-wash); color: var(--warn-ink); }
.chip-serious { background: var(--serious-wash); color: var(--serious-ink); }
.chip-crit { background: var(--crit-wash); color: var(--crit-ink); }
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.alert > span { flex: 1 1 260px; min-width: 0; }
.alert-warn { background: var(--warn-wash); border-color: transparent; color: var(--warn-ink); }
.alert-serious { background: var(--serious-wash); border-color: transparent; color: var(--serious-ink); }
.alert-info { background: var(--info-wash); border-color: transparent; color: var(--info-ink); }
.alert .btn { color: var(--ink); }
.banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 9px clamp(16px, 3vw, 34px); border-bottom: 1px solid var(--line); }
.banner > span { flex: 1 1 260px; }
.banner-demo { background: var(--accent-wash); color: var(--accent-strong); }
.banner-warn { background: var(--warn-wash); color: var(--warn-ink); }
.banner .btn { color: var(--ink); }
.delta { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.delta-good { color: var(--good-ink); }
.delta-bad { color: var(--crit-ink); }

/* ---------- period tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; }
.tile { display: flex; flex-direction: column; text-align: left; padding: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); min-width: 0; overflow: hidden; box-shadow: var(--card-shadow); }
button.tile:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.tile.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.tile-top { display: flex; flex-direction: column; gap: 1px; padding: 12px 16px 11px; color: var(--on-band); background: var(--band-3); }
.tile-b1 .tile-top { background: var(--band-1); } .tile-b2 .tile-top { background: var(--band-2); } .tile-b3 .tile-top { background: var(--band-3); }
.tile-b4 .tile-top { background: var(--band-4); } .tile-b5 .tile-top { background: var(--band-5); }
.tile-label { font-weight: 600; font-size: 15px; }
.tile-range { font-size: 12.5px; opacity: .88; }
.tile-body { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px 14px; }
.tile-k { color: var(--muted); font-size: 12.5px; }
.tile-value { font-size: 27px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
.tile-delta { min-height: 18px; display: block; font-size: 12px; }
.tile-rows { display: grid; gap: 4px; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; }
.tile-row { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-2); }
.tile-row strong { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- period bar ---------- */
.pbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.pchips { display: flex; flex-wrap: wrap; gap: 4px; }
.pchip { height: 30px; padding: 0 11px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); color: var(--ink-2); font-size: 13px; font-weight: 500; white-space: nowrap; }
.pchip:hover { background: var(--surface-3); }
.pchip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pcustom { display: flex; align-items: center; gap: 6px; }
.pcustom .input { height: 30px; font-size: 13px; padding: 0 8px; width: 138px; }
.pcustom.on .input { border-color: var(--accent); }

/* ---------- stat strip ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 158px), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat-label { color: var(--muted); font-size: 12px; }
.stat-value { font-size: 21px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; overflow-wrap: anywhere; }
.stat-sub { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; color: var(--muted); font-size: 12px; min-height: 18px; }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; min-width: 0; }
.tbl-short { max-height: 320px; overflow-y: auto; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 9px 12px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
.tbl thead th { font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; background: var(--surface); border-bottom: 2px solid var(--line-2); position: sticky; top: 0; }
.tbl tbody tr:last-child td, .tbl tbody tr:last-child th { border-bottom: 0; }
.tbl tfoot td { border-top: 1px solid var(--line); border-bottom: 0; }
.tbl .num { text-align: right; white-space: nowrap; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tr.total td, .tbl tr.total th { font-weight: 600; background: var(--surface-2); }
.tbl tr.sub td, .tbl tr.sub th { color: var(--ink-2); background: var(--surface-2); }
.tbl tr.meta td, .tbl tr.meta th { color: var(--muted); }
.tbl-compact th, .tbl-compact td { padding: 6px 10px; }
.tbl-compact .pcell { min-width: 130px; }
.tbl-products { min-width: 940px; }
.tbl-tx { min-width: 860px; }
.tbl-lot { min-width: 820px; }
.tbl-form { min-width: 820px; }
.tbl-form td, .tbl-lot td { padding: 6px 8px; }
.tbl-form .input, .tbl-lot .input { width: 100%; }
.tbl-form .affix .input, .tbl-lot .affix .input { width: 86px; }
.tbl-lot .input.num { width: 76px; }
.tbl-pl { min-width: 720px; }
.tbl-pl th.stick { position: sticky; left: 0; background: var(--surface); font-weight: 500; color: var(--ink); min-width: 210px; z-index: 1; }
.tbl-pl thead th.stick { background: var(--surface); color: var(--ink-2); z-index: 2; }
.tbl-pl tr.total th.stick, .tbl-pl tr.sub th.stick { background: var(--surface-2); }
.th-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; color: inherit; font-weight: inherit; font-size: inherit; }
th.sortable.on .th-btn { color: var(--ink); font-weight: 600; }
th.num .th-btn { flex-direction: row-reverse; }
.pcell { display: flex; flex-direction: column; gap: 1px; align-items: flex-start; text-align: left; border: 0; background: transparent; padding: 0; color: inherit; min-width: 180px; max-width: 340px; }
button.pcell:hover .pname { color: var(--accent-strong); text-decoration: underline; }
.pname { font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
td > .chip { margin-top: 4px; }
.desc { display: block; color: var(--muted); font-size: 12.5px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.daycell { display: inline-flex; align-items: center; gap: 8px; }
.pager { display: flex; gap: 12px; align-items: center; justify-content: center; }

/* ---------- ledger ---------- */
.ledger { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.lg-row { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(86px, auto) 60px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.lg-headrow { color: var(--muted); font-size: 12px; padding-top: 0; }
.lg-amt, .lg-pct { text-align: right; white-space: nowrap; }
.lg-pct { color: var(--muted); font-size: 12.5px; }
.lg-headrow .lg-pct { font-size: 12px; }
.lg-label { min-width: 0; }
.lg-toggle { display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; padding: 0; color: inherit; text-align: left; margin-left: -17px; }
.lg-toggle:hover span { text-decoration: underline; }
.ledger { padding-left: 17px; }
.lg-detail { color: var(--ink-2); font-size: 13px; padding: 5px 0 5px 14px; border-bottom-style: dashed; }
.lg-subtotal { font-weight: 600; }
.lg-total { font-weight: 700; font-size: 16px; border-bottom: 0; border-top: 2px solid var(--ink); margin-top: -1px; padding-top: 10px; }
.lg-foot { display: flex; flex-wrap: wrap; gap: 6px 18px; padding-top: 10px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); margin-top: 8px; }
.lg-foot strong { color: var(--ink); font-weight: 600; }
.cellbar { display: block; height: 6px; }
.cellbar-fill { display: block; height: 100%; border-radius: 0 3px 3px 0; background: var(--bar-quiet); min-width: 1px; }
.cellbar-income .cellbar-fill { background: var(--s1); }
@media (max-width: 520px) { .lg-row { grid-template-columns: minmax(0, 1fr) auto 54px; } .lg-bar { display: none; } }

/* ---------- charts ---------- */
.chart { position: relative; min-width: 0; }
.chart svg { display: block; max-width: 100%; outline-offset: 4px; }
.c-bar { fill: var(--s1); }
.c-bar.on { filter: brightness(1.18); }
.c-line { fill: none; stroke: var(--s2); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.c-dot { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
.c-grid { stroke: var(--grid); stroke-width: 1; }
.c-axis { stroke: var(--axis); stroke-width: 1; }
.c-cross { stroke: var(--line-2); stroke-width: 1; }
.c-tick { fill: var(--muted); font-size: 11px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.c-tip { position: absolute; z-index: 3; pointer-events: none; min-width: 168px; padding: 9px 11px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow); font-size: 12.5px; }
.c-tip-h { color: var(--muted); margin-bottom: 5px; }
.c-tip-r { display: flex; align-items: center; gap: 7px; }
.c-tip-r strong { margin-left: auto; font-variant-numeric: tabular-nums; }
.c-tip-l { color: var(--ink-2); }
.c-tip-x { color: var(--muted); }
.c-tip-x span:last-child { margin-left: auto; font-variant-numeric: tabular-nums; }
.c-key { display: inline-block; flex: none; }
.c-key-bar { width: 10px; height: 10px; border-radius: 2px; background: var(--s1); }
.c-key-line { width: 14px; height: 0; border-top: 2px solid var(--s2); }
.c-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; }
.c-leg { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); }
.c-leg strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.meter { display: inline-block; width: 54px; height: 6px; border-radius: 3px; background: var(--info-wash); overflow: hidden; }
.meter-fill { display: block; height: 100%; border-radius: 3px; background: var(--muted); }
.meter-good { background: var(--good-wash); } .meter-good .meter-fill { background: var(--good); }
.meter-warn { background: var(--warn-wash); } .meter-warn .meter-fill { background: var(--warn); }
.meter-serious { background: var(--serious-wash); } .meter-serious .meter-fill { background: var(--serious); }
.meter-crit { background: var(--crit-wash); } .meter-crit .meter-fill { background: var(--crit); }

/* ---------- empty, welcome, guides, drop ---------- */
.empty { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 28px 22px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; background: var(--surface); }
.empty h3 { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.empty p { color: var(--ink-2); max-width: 64ch; }
.steps { list-style: none; display: flex; flex-direction: column; gap: 16px; }
.step { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; }
.step-n { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line-2); color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
.step.done .step-n { background: var(--good-wash); border-color: transparent; color: var(--good-ink); }
.step h3 { font-size: 14px; font-weight: 600; }
.step p { color: var(--ink-2); margin: 2px 0 8px; max-width: 60ch; }
.plain { list-style: none; display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); }
.guides { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.guide { display: flex; flex-direction: column; }
.guide-steps { padding: 12px 16px 16px 36px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }
.card-body > .guide-steps { padding: 0 0 0 20px; }
.drop { border: 2px dashed var(--line-2); border-radius: var(--r); padding: 30px 20px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; background: var(--surface); color: var(--ink-2); }
.drop h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--ink); }
.drop p { max-width: 60ch; }
.results { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.results li { display: flex; gap: 10px; align-items: flex-start; }
.results li > div { min-width: 0; overflow-wrap: anywhere; }

/* ---------- lots ---------- */
.lot { overflow: hidden; }
.lot-head { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; padding: 14px 16px; }
.lot-head .field .input { width: 150px; }
.lot-head .field .input[id$="-sup"] { width: 250px; }
.lot-head .affix .input { width: 92px; }
.lot-del { margin-left: auto; }

/* ---------- drawer, modal, toast, veil ---------- */
.drawer-wrap { position: fixed; inset: 0; z-index: 40; background: var(--veil); display: flex; justify-content: flex-end; }
.drawer { width: min(620px, 100%); height: 100%; background: var(--surface); display: flex; flex-direction: column; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.drawer-title { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.drawer-title .input { width: 100%; font-family: var(--font-display); font-size: 17px; font-weight: 600; height: 38px; }
.drawer-title .sku { display: inline; }
.drawer-body { overflow-y: auto; padding: 16px 18px 28px; display: flex; flex-direction: column; gap: 22px; }
.dsec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.dsec > h3 { font-size: 14px; font-weight: 600; }
.dsec > h3 .muted { font-weight: 400; }
.calc { display: flex; flex-direction: column; gap: 12px; }
.calc-in { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 14px; }
.calc-out { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.calc-res { background: var(--surface-2); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.calc-res span { color: var(--muted); font-size: 12px; }
.calc-res strong { font-size: 18px; font-weight: 600; }
.modal-wrap { position: fixed; inset: 0; z-index: 60; background: var(--veil); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { width: min(480px, 100%); background: var(--surface); border-radius: 6px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 6px; }
.modal-head h3 { font-family: var(--font-display); font-size: 18px; font-weight: 600; text-wrap: balance; }
.modal-body { padding: 6px 16px 14px; color: var(--ink-2); }
.modal-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(520px, calc(100% - 32px)); pointer-events: none; }
.toast { display: flex; gap: 9px; align-items: flex-start; padding: 10px 14px; border-radius: 6px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow); font-size: 13.5px; max-width: 100%; transition: opacity .25s, transform .25s; }
.toast.out { opacity: 0; transform: translateY(6px); }
.toast .ic { margin-top: 2px; }
#dropveil { position: fixed; inset: 0; z-index: 70; background: var(--veil); display: flex; align-items: center; justify-content: center; padding: 24px; pointer-events: none; }
.veil-box { border: 2px dashed var(--on-accent); border-radius: 6px; padding: 34px 28px; background: var(--accent); color: var(--on-accent); text-align: center; font-family: var(--font-display); font-size: 22px; font-weight: 600; max-width: 520px; }
.veil-box small { display: block; font-family: var(--font-body); font-size: 14px; font-weight: 400; margin-top: 6px; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<script>
(function () {
"use strict";
/* ============ util: numbers, dates, delimited text ============ */
const U = {};

U.round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;

/* Parse a number out of a report cell or a typed input.
   Accepts "$1,234.56", "(12.50)", "-3.2", "12,5", "45%". Returns 0 for blanks. */
U.num = function (v) {
  if (v == null) return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v).trim().replace(/[\u2212\u2013\u2014]/g, '-');
  if (!s) return 0;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[^\d,.\-]/g, '');
  if (!s) return 0;
  if (s.indexOf('-') !== -1) { neg = !neg; s = s.replace(/-/g, ''); }
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) {
    s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  } else if (lc > -1) {
    const parts = s.split(',');
    s = (parts.length === 2 && parts[1].length !== 3) ? parts[0] + '.' + parts[1] : s.replace(/,/g, '');
  }
  const n = parseFloat(s);
  return isFinite(n) ? (neg ? -n : n) : 0;
};
/* Like num, but null for an empty / unparseable input (for optional fields). */
U.numOrNull = function (v) {
  if (v == null) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  if (!/\d/.test(String(v))) return null;
  return U.num(v);
};

/* ---------- money / number formatting (Amazon US style, so it matches the reports) ---------- */
U.cur = '$';
U.money = function (n, opts) {
  opts = opts || {};
  if (n == null || !isFinite(n)) return '—';
  const abs = Math.abs(n);
  const dec = opts.dec != null ? opts.dec : (abs >= 1000 && !opts.exact ? 0 : 2);
  const body = abs.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  const sign = n < -0.004 ? '−' : (opts.plus && n > 0.004 ? '+' : '');
  return sign + U.cur + body;
};
U.moneyCompact = function (n) {
  if (n == null || !isFinite(n)) return '—';
  const abs = Math.abs(n);
  const sign = n < 0 ? '−' : '';
  if (abs >= 1e6) return sign + U.cur + (abs / 1e6).toFixed(abs >= 1e7 ? 0 : 1) + 'M';
  if (abs >= 1e4) return sign + U.cur + (abs / 1e3).toFixed(abs >= 1e5 ? 0 : 1) + 'K';
  if (abs >= 1e3) return sign + U.cur + Math.round(abs).toLocaleString('en-US');
  return sign + U.cur + abs.toFixed(abs >= 100 ? 0 : 2);
};
U.int = function (n) {
  if (n == null || !isFinite(n)) return '—';
  return (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('en-US');
};
U.pct = function (n, dec) {
  if (n == null || !isFinite(n)) return '—';
  const d = dec != null ? dec : 1;
  return (n < 0 ? '−' : '') + '%' + Math.abs(n * 100).toFixed(d);
};
U.dec = function (n, d) {
  if (n == null || !isFinite(n)) return '—';
  return (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
};

/* ---------- dates: everything internal is a 'YYYY-MM-DD' string ---------- */
U.pad = (n) => String(n).padStart(2, '0');
U.ymd = (y, m, d) => y + '-' + U.pad(m) + '-' + U.pad(d);
U.toUTC = (s) => { const p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); };
U.fromUTC = (ms) => { const d = new Date(ms); return U.ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); };
U.addDays = (s, n) => U.fromUTC(U.toUTC(s) + n * 864e5);
U.diffDays = (a, b) => Math.round((U.toUTC(b) - U.toUTC(a)) / 864e5); // b - a
U.monthStart = (s) => s.slice(0, 8) + '01';
U.monthEnd = (s) => { const p = s.split('-'); return U.fromUTC(Date.UTC(+p[0], +p[1], 0)); };
U.addMonths = (s, n) => {
  const p = s.split('-'); const y = +p[0], m = +p[1] - 1 + n, d = +p[2];
  const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  return U.fromUTC(Date.UTC(y, m, Math.min(d, last)));
};
U.weekStart = (s) => { const dow = (new Date(U.toUTC(s)).getUTCDay() + 6) % 7; return U.addDays(s, -dow); }; // Monday
U.isYmd = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);

U.TR_MON = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
U.TR_MON_LONG = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
U.fmtDate = function (s, opts) {
  if (!U.isYmd(s)) return '—';
  const p = s.split('-');
  const base = (+p[2]) + ' ' + U.TR_MON[+p[1] - 1];
  return (opts && opts.noYear) ? base : base + ' ' + p[0];
};
U.fmtMonth = function (s, long) {
  const p = s.split('-');
  return (long ? U.TR_MON_LONG : U.TR_MON)[+p[1] - 1] + ' ' + p[0];
};
U.fmtRange = function (a, b) {
  if (!a || !b) return '—';
  if (a === b) return U.fmtDate(a);
  if (a.slice(0, 4) === b.slice(0, 4)) return U.fmtDate(a, { noYear: true }) + ' – ' + U.fmtDate(b);
  return U.fmtDate(a) + ' – ' + U.fmtDate(b);
};

/* Wall-clock date/time in a given IANA zone for an absolute instant. */
U.inZone = function (date, tz) {
  try {
    const f = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
    const o = {};
    f.formatToParts(date).forEach((p) => { o[p.type] = p.value; });
    return { d: o.year + '-' + o.month + '-' + o.day, t: (o.hour === '24' ? '00' : o.hour) + ':' + o.minute + ':' + o.second };
  } catch (e) {
    return { d: U.ymd(date.getUTCFullYear(), date.getUTCMonth() + 1, date.getUTCDate()), t: U.pad(date.getUTCHours()) + ':' + U.pad(date.getUTCMinutes()) + ':' + U.pad(date.getUTCSeconds()) };
  }
};
U.today = (tz) => U.inZone(new Date(), tz || 'America/Los_Angeles').d;

U.MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };

/* Parse the date formats Amazon reports use. Returns {d:'YYYY-MM-DD', t:'HH:MM:SS'} or null.
   Dates written with a named zone ("... PM PDT") are kept as written: that is the day Amazon reports.
   ISO dates with an offset are converted to `tz`. */
U.parseDate = function (raw, tz) {
  if (raw == null) return null;
  if (raw instanceof Date) {
    if (isNaN(raw)) return null;
    return { d: U.ymd(raw.getUTCFullYear(), raw.getUTCMonth() + 1, raw.getUTCDate()), t: '00:00:00' };
  }
  const s = String(raw).trim().replace(/ /g, ' ');
  if (!s) return null;
  let m;
  // Sep 14, 2026 10:22:33 PM PDT
  m = s.match(/^([A-Za-z]{3,9})\.? +(\d{1,2}),? +(\d{4}),?(?: +(\d{1,2}):(\d{2})(?::(\d{2}))?(?: *([AaPp])\.?[Mm]\.?)?)?/);
  if (m && U.MON[m[1].slice(0, 4).toLowerCase()] || (m && U.MON[m[1].slice(0, 3).toLowerCase()])) {
    const mon = U.MON[m[1].slice(0, 4).toLowerCase()] || U.MON[m[1].slice(0, 3).toLowerCase()];
    return { d: U.ymd(+m[3], mon, +m[2]), t: U._time(m[4], m[5], m[6], m[7]) };
  }
  // 14 Sep 2026 22:22:33 UTC
  m = s.match(/^(\d{1,2}) +([A-Za-z]{3,9})\.?,? +(\d{4})(?: +(\d{1,2}):(\d{2})(?::(\d{2}))?(?: *([AaPp])\.?[Mm]\.?)?)?/);
  if (m && U.MON[m[2].slice(0, 3).toLowerCase()]) {
    return { d: U.ymd(+m[3], U.MON[m[2].slice(0, 3).toLowerCase()], +m[1]), t: U._time(m[4], m[5], m[6], m[7]) };
  }
  // ISO: 2026-09-14T17:22:33+00:00 / 2026-09-14 17:22:33 UTC / 2026-09-14
  m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[T ]+(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\.\d+)?)? *(Z|UTC|GMT|[+-]\d{2}:?\d{2})?/i);
  if (m) {
    if (m[4] != null && m[7]) {
      let off = m[7].toUpperCase();
      if (off === 'UTC' || off === 'GMT') off = 'Z';
      else if (/^[+-]\d{4}$/.test(off)) off = off.slice(0, 3) + ':' + off.slice(3);
      const dt = new Date(m[1] + '-' + U.pad(+m[2]) + '-' + U.pad(+m[3]) + 'T' + U.pad(+m[4]) + ':' + m[5] + ':' + (m[6] || '00') + off);
      if (!isNaN(dt)) return U.inZone(dt, tz || 'America/Los_Angeles');
    }
    return { d: U.ymd(+m[1], +m[2], +m[3]), t: U._time(m[4], m[5], m[6]) };
  }
  // US: 9/14/2026 10:22:33 PM
  m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})(?:,? +(\d{1,2}):(\d{2})(?::(\d{2}))?(?: *([AaPp])\.?[Mm]\.?)?)?/);
  if (m) {
    let y = +m[3]; if (y < 100) y += 2000;
    let mo = +m[1], d = +m[2];
    if (mo > 12 && d <= 12) { const x = mo; mo = d; d = x; }
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return { d: U.ymd(y, mo, d), t: U._time(m[4], m[5], m[6], m[7]) };
  }
  return null;
};
U._time = function (h, mi, se, ap) {
  if (h == null) return '00:00:00';
  let hh = +h;
  if (ap) { const p = ap.toLowerCase() === 'p'; if (p && hh < 12) hh += 12; if (!p && hh === 12) hh = 0; }
  return U.pad(hh) + ':' + mi + ':' + (se || '00');
};
U.excelSerialToYmd = function (n) { return U.fromUTC(Math.round((n - 25569) * 864e5)); };

/* ---------- delimited text (CSV / TSV) ---------- */
U.detectDelim = function (text) {
  const lines = text.split(/\r?\n/, 40).filter((l) => l.trim());
  let best = ',', bestScore = -1;
  ['\t', ',', ';'].forEach((d) => {
    let mx = 0;
    lines.forEach((l) => { const c = l.split(d).length - 1; if (c > mx) mx = c; });
    const score = mx * (d === '\t' ? 1.5 : 1);
    if (score > bestScore) { bestScore = score; best = d; }
  });
  return best;
};
U.parseDelimited = function (text, delim) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  delim = delim || U.detectDelim(text);
  const rows = [];
  let row = [], field = '', inQ = false, i = 0;
  const n = text.length;
  while (i < n) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"' && field === '') { inQ = true; i++; continue; }
    if (c === delim) { row.push(field); field = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += c; i++;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return { rows, delim };
};
U.normHeader = (h) => String(h == null ? '' : h).replace(/﻿/g, '').replace(/ /g, ' ').trim().toLowerCase().replace(/\s+/g, ' ');

U.csvCell = function (v) {
  const s = v == null ? '' : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
U.toCsv = (rows) => rows.map((r) => r.map(U.csvCell).join(',')).join('\r\n');

U.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
U.clamp = (n, a, b) => Math.max(a, Math.min(b, n));
U.sum = (arr, f) => { let s = 0; for (let i = 0; i < arr.length; i++) s += f ? f(arr[i]) : arr[i]; return s; };

/* ============ parsers: recognise and read Seller Central reports ============ */

  'description': '_desc', 'quantity': '_qty', 'marketplace': '_mkt', 'account type': '_acct',
  'fulfillment': '_ful', 'order city': '_city', 'order state': '_state', 'order postal': '_zip',
  'tax collection model': '_tcm',
  'product sales': 'ps', 'product sales tax': 'pst', 'shipping credits': 'sc', 'shipping credits tax': 'sct',

P.TX_AMOUNT_KEYS = ['ps', 'pst', 'sc', 'sct', 'gw', 'gwt', 'rf', 'rft', 'pr', 'prt', 'mwt', 'sf', 'ff', 'otf', 'ot'];

P.signature = function (h) {
  const has = (x) => h.indexOf(x) !== -1;
  const some = (f) => h.some(f);
  if (has('date/time') && has('type') && has('total')) return 'tx';
  if (has('amazon-order-id') && has('purchase-date')) return 'orders';
  if (has('return-date') && (has('detailed-disposition') || has('reason'))) return 'returns';
  if (has('spend') && has('impressions') && (has('advertised sku') || has('campaign name'))) return 'ads';
  if (some((x) => x.indexOf('(child) asin') === 0) || ((has('sessions - total') || has('sessions')) && has('units ordered'))) return 'traffic';
  if (has('sku') && (has('afn-fulfillable-quantity') || has('available') || has('afn-total-quantity') || has('afn-warehouse-quantity'))) return 'inventory';
  return null;
};

/* Find the header row among the first lines (Amazon puts a preamble above some reports). */
P.findHeader = function (rows) {
  const lim = Math.min(rows.length, 80);
  for (let i = 0; i < lim; i++) {
    const h = rows[i].map(U.normHeader);
    const kind = P.signature(h);
    if (kind) return { index: i, headers: h, kind };
  }
  return null;
};

P.col = function (h) {
  for (let a = 1; a < arguments.length; a++) {
    const c = arguments[a];
    if (c instanceof RegExp) { const i = h.findIndex((x) => c.test(x)); if (i !== -1) return i; }
    else { const i = h.indexOf(c); if (i !== -1) return i; }
  }
  return -1;
};
P.cell = (r, i) => (i === -1 || r[i] == null ? '' : r[i]);
P.str = (r, i) => String(P.cell(r, i)).trim();

P.dateOf = function (v, tz) {
  if (typeof v === 'number' && v > 20000 && v < 90000) return { d: U.excelSerialToYmd(v), t: '00:00:00' };
  return U.parseDate(v, tz);
};

/* rows: array of arrays (strings from CSV, or raw values from a spreadsheet). */
P.parseRows = function (rows, opts) {
  opts = opts || {};
  const tz = opts.tz || 'America/Los_Angeles';
  const hd = P.findHeader(rows);
  if (!hd) {
    const first = (rows.find((r) => r.some((c) => String(c).trim())) || []).slice(0, 6).join(', ');
    return { error: 'Bu dosyayı tanıyamadım. İlk satırı: "' + first.slice(0, 140) + '". Desteklenen raporlar Veri sekmesinde yazıyor.' };
  }
  const body = rows.slice(hd.index + 1).filter((r) => r.length > 1 || (r[0] != null && String(r[0]).trim() !== ''));
  const fn = P['read_' + hd.kind];
  const res = fn(hd.headers, body, tz);
  res.kind = hd.kind;
  return res;
};

P.parseText = function (text, opts) {
  const parsed = U.parseDelimited(text);
  return P.parseRows(parsed.rows, opts);
};

P.range = function (rows, key) {
  let from = null, to = null;
  for (let i = 0; i < rows.length; i++) {
    const d = key ? rows[i][key] : rows[i].t.slice(0, 10);
    if (!from || d < from) from = d;
    if (!to || d > to) to = d;
  }
  return { from, to };
};

/* ---------- Date Range Report – Transaction ---------- */
P.read_tx = function (h, body) {
  const map = h.map((x) => P.TX_COLS[x] || null);
  const idx = {};
  map.forEach((k, i) => { if (k && idx[k] == null) idx[k] = i; });
  const out = [], products = {}, warnings = [];
  let skipped = 0;
  for (let r = 0; r < body.length; r++) {
    const row = body[r];
    const dt = P.dateOf(P.cell(row, idx._dt));
    if (!dt) { skipped++; continue; }
    const a = {};
    for (let k = 0; k < P.TX_AMOUNT_KEYS.length; k++) {
      const key = P.TX_AMOUNT_KEYS[k];
      if (idx[key] == null) continue;
      const v = U.num(row[idx[key]]);
      if (v) a[key] = U.round2(v);
    }
    let known = 0;
    for (const k in a) known += a[k];
    const tot = idx.tot != null && String(P.cell(row, idx.tot)).trim() !== '' ? U.round2(U.num(row[idx.tot])) : U.round2(known);
    a.tot = tot;
    const o = { t: dt.d + ' ' + dt.t, y: P.str(row, idx._type), a };
    const oid = P.str(row, idx._oid); if (oid) o.o = oid;
    const sku = P.str(row, idx._sku); if (sku) o.s = sku;
    const desc = P.str(row, idx._desc); if (desc) o.x = desc.slice(0, 160);
    const q = U.num(P.cell(row, idx._qty)); if (q) o.q = q;
    const ful = P.str(row, idx._ful); if (ful) o.f = /amazon/i.test(ful) ? 'A' : 'M';
    const st = P.str(row, idx._state); if (st) o.st = st.slice(0, 24);
    out.push(o);
    if (sku && /^order$/i.test(o.y) && desc && !products[sku]) products[sku] = { sku, name: desc };
  }
  if (skipped > 3) warnings.push(skipped + ' satırın tarihi okunamadı ve atlandı.');
  out.sort((x, y) => (x.t < y.t ? -1 : x.t > y.t ? 1 : 0));
  const rg = P.range(out);
  return { rows: out, from: rg.from, to: rg.to, count: out.length, warnings, products: Object.values(products) };
};

/* ---------- All Orders ---------- */
P.read_orders = function (h, body, tz) {
  const c = {
    oid: P.col(h, 'amazon-order-id'), dt: P.col(h, 'purchase-date'), st: P.col(h, 'order-status'),

    state: P.col(h, 'ship-state'), ful: P.col(h, 'fulfillment-channel'), disc: P.col(h, 'item-promotion-discount'),
  };
  const out = [], products = {};
  let skipped = 0;
  for (let r = 0; r < body.length; r++) {
    const row = body[r];
    const dt = P.dateOf(P.cell(row, c.dt), tz);
    const sku = P.str(row, c.sku);
    if (!dt || !sku) { skipped++; continue; }
    const o = { t: dt.d + ' ' + dt.t, o: P.str(row, c.oid), s: sku, q: U.num(P.cell(row, c.qty)), p: U.round2(U.num(P.cell(row, c.price))) };
    const st = P.str(row, c.st); if (st) o.st = st;

    price: P.col(h, 'your-price'), snap: P.col(h, 'snapshot-date'), cond: P.col(h, 'condition'),
  };

/* ---------- Sponsored Products: Advertised product report ---------- */
P.read_ads = function (h, body) {
  const c = {
    date: P.col(h, 'date'), start: P.col(h, 'start date'), end: P.col(h, 'end date'),
    camp: P.col(h, 'campaign name'), sku: P.col(h, 'advertised sku'), asin: P.col(h, 'advertised asin'),
    im: P.col(h, 'impressions'), cl: P.col(h, 'clicks'), sp: P.col(h, 'spend'),
    sa: P.col(h, /^\d+ day total sales/, 'total sales', 'sales'),
    or: P.col(h, /^\d+ day total orders/, 'total orders', 'orders'),
    un: P.col(h, /^\d+ day total units/, 'total units', 'units'),
  };
  const agg = {}, warnings = [];
  let skipped = 0;
  const add = (d, camp, sku, f, row) => {
    const key = d + '|' + camp + '|' + sku;
    const o = agg[key] || (agg[key] = { d, c: camp, s: sku, im: 0, cl: 0, sp: 0, sa: 0, or: 0, un: 0 });
    o.im += U.num(P.cell(row, c.im)) * f; o.cl += U.num(P.cell(row, c.cl)) * f; o.sp += U.num(P.cell(row, c.sp)) * f;
    o.sa += U.num(P.cell(row, c.sa)) * f; o.or += U.num(P.cell(row, c.or)) * f; o.un += U.num(P.cell(row, c.un)) * f;
  };
  let spread = false;
  for (let r = 0; r < body.length; r++) {
    const row = body[r];
    const camp = P.str(row, c.camp).slice(0, 80), sku = P.str(row, c.sku);
    if (c.date !== -1) {
      const d = P.dateOf(P.cell(row, c.date));
      if (!d) { skipped++; continue; }
      add(d.d, camp, sku, 1, row);
    } else {
      const a = P.dateOf(P.cell(row, c.start)), b = P.dateOf(P.cell(row, c.end));
      if (!a || !b) { skipped++; continue; }
      const n = Math.max(1, U.diffDays(a.d, b.d) + 1);
      if (n > 1) spread = true;
      for (let i = 0; i < n; i++) add(U.addDays(a.d, i), camp, sku, 1 / n, row);
    }
  }
  if (spread) warnings.push('Rapor günlük değil. Harcama, dönemin günlerine eşit dağıtıldı. Günlük kırılım için raporu "Daily" olarak indir.');
  if (skipped > 3) warnings.push(skipped + ' satır atlandı (tarih okunamadı).');
  const out = Object.values(agg).map((o) => {
    o.sp = Math.round(o.sp * 10000) / 10000; o.sa = Math.round(o.sa * 10000) / 10000;
    o.im = Math.round(o.im * 100) / 100; o.cl = Math.round(o.cl * 100) / 100;
    o.or = Math.round(o.or * 100) / 100; o.un = Math.round(o.un * 100) / 100;
    if (!o.s) delete o.s;
    return o;
  }).sort((x, y) => (x.d < y.d ? -1 : x.d > y.d ? 1 : 0));
  const rg = P.range(out, 'd');
  return { rows: out, from: rg.from, to: rg.to, count: out.length, warnings, products: [] };
};
